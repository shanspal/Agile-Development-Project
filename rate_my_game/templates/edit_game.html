{% extends "base.html" %} {% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Edit Game</h1>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post" class="row g-3">
          <div class="col-12">
            <label class="form-label">Game Name</label>
            <input
              type="text"
              name="name"
              class="form-control"
              value="{{ game.name }}"
              required
            />
          </div>

          <div class="col-12">
            <label class="form-label">Company</label>
            <input
              type="text"
              name="company"
              class="form-control"
              value="{{ game.company }}"
              required
            />
          </div>

          <div class="col-12">
            <label class="form-label">Image URL</label>
            <input
              type="text"
              name="image_url"
              class="form-control"
              value="{{ game.image_url or '' }}"
              placeholder="/static/images/valorant.png"
            />
          </div>

          <div class="col-12">
            <label class="form-label">Description</label>
            <textarea
              name="description"
              class="form-control"
              rows="4"
              placeholder="Write a short description of the game..."
            >
{{ game.description or '' }}</textarea
            >
          </div>

          <div class="col-12 d-flex justify-content-end">
            <a
              href="{{ url_for('game_detail', game_id=game.id) }}"
              class="btn btn-outline-secondary me-2"
              >Cancel</a
            >
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
