<!doctype html>
<html lang="en">
  <head>
    <title>Rate My Game</title>
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='images/controller.png') }}"
    />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3 shadow-lg">
      <div class="container-fluid px-4 px-xl-5">
        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="{{ url_for('index') }}"
        >
          <img
            src="{{ url_for('static', filename='images/controller.png') }}"
            alt="Logo"
            width="34"
            height="34"
          />
          <span class="brand-title mb-0">Rate My Game</span>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavbar"
          aria-controls="mainNavbar"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
          <ul
            class="navbar-nav nav-pills nav-fill mb-2 mb-lg-0 ms-lg-4 gap-2 w-100"
          >
            <li class="nav-item">
              <a
                class="nav-link {% if request.endpoint == 'index' %}active{% endif %}"
                href="{{ url_for('index') }}"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link {% if request.endpoint == 'ranks' %}active{% endif %}"
                href="{{ url_for('ranks') }}"
                >Ranks</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link {% if request.endpoint == 'add_game' %}active{% endif %}"
                href="{{ url_for('add_game') }}"
                >Add Game</a
              >
            </li>
          </ul>

          <div class="d-flex align-items-center gap-2 ms-lg-auto">
            <button
              class="btn btn-outline-light btn-sm"
              id="theme-toggle"
              type="button"
            >
              Dark
            </button>
            {% if session.get("user_id") %}
            <form method="post" action="{{ url_for('logout') }}" class="m-0">
              <button type="submit" class="btn btn-outline-light btn-sm">
                Logout
              </button>
            </form>
            {% else %}
            <a
              class="btn btn-outline-light btn-sm"
              href="{{ url_for('login') }}"
              >Login</a
            >
            <a class="btn btn-primary btn-sm" href="{{ url_for('register') }}"
              >Register</a
            >
            {% endif %}
          </div>
        </div>
      </div>
    </nav>

    <main class="container-fluid px-4 px-xl-5 mb-5">
      {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-muted small py-3 border-top bg-body">
      <span>Rate My Game · Gameplay & Difficulty at a glance</span>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="{{ url_for('static', filename='js/ui.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
